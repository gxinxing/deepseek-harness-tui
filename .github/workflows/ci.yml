# Self-inspection CI: lint + format-check + test on every push/PR
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Lint · Format · Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint JS (self-inspect · code quality)
        run: pnpm lint

      - name: Lint YAML — GitHub Actions structure (self-inspect · CI correctness)
        run: pnpm lint:yaml

      - name: Dead-code scan (self-inspect · no unused deps / binaries)
        run: pnpm knip --dependencies

      - name: Config drift guard (self-inspect · stale config files)
        run: |
          echo "=== Checking for stale config files ==="
          if [ -f .eslintrc.json ]; then
            echo "::error::.eslintrc.json exists but eslint.config.js is the active config — remove .eslintrc.json"
            exit 1
          fi
          echo "No stale config files detected ✓"

      - name: Format check (self-inspect · style gate)
        run: pnpm format:check

      - name: Test (self-inspect · correctness)
        run: pnpm test

      - name: Coverage upload
        if: matrix.node-version == '22'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true
